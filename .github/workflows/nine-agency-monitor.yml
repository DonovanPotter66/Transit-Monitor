name: Nine-agency transit monitor

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Run MBTA browser diagnostics only (no workbook processing)"
        required: false
        default: false
        type: boolean
      diagnostic_excluded:
        description: "Run read-only diagnostics for MBTA, WMATA, MTA, and LA Metro"
        required: false
        default: false
        type: boolean
      diagnostic_structure:
        description: "Capture source DOM structure and extraction evidence only (no workbook processing)"
        required: false
        default: false
        type: boolean
  schedule:
    # GitHub schedules are UTC. These two triggers cover Pacific daylight and
    # standard time; the local-time gate below permits exactly one 06:00 run.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The job must not publish until these are configured as repository or
      # environment secrets.  Values are never written to logs or payloads.
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      ONEDRIVE_ITEM_ID: ${{ secrets.ONEDRIVE_ITEM_ID }}
      ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}

    steps:
      - name: Check out monitor
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify checked-out revision
        shell: bash
        run: |
          echo "Checked-out commit: $(git rev-parse HEAD)"
          grep -o '"path":"python[0-9]*"' orchestrator/config.github-actions.json || true

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Provide orchestrator Python aliases
        shell: bash
        run: |
          # Some cloud path resolution treats configured python names as
          # repository-relative files. Create those aliases explicitly.
          ln -sf "$(command -v python)" orchestrator/python
          ln -sf "$(command -v python)" orchestrator/python3

      - name: Install monitor dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud-transit-monitor/requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run MBTA diagnostic only
        if: inputs.diagnostic_only == true
        shell: bash
        run: python orchestrator/diagnose_mbta.py --output state/mbta-diagnostic.json

      - name: Run excluded-agency diagnostics only
        if: inputs.diagnostic_excluded == true
        shell: bash
        run: python orchestrator/diagnose_excluded_agencies.py --output state/excluded-agencies-diagnostic.json

      - name: Upload excluded-agency diagnostic report
        if: always() && inputs.diagnostic_excluded == true
        uses: actions/upload-artifact@v4
        with:
          name: excluded-agencies-diagnostic-${{ github.run_id }}
          path: state/excluded-agencies-diagnostic.json
          if-no-files-found: error

      - name: Run source structure diagnostics only
        if: inputs.diagnostic_structure == true
        shell: bash
        run: python orchestrator/diagnose_source_structure.py --output state/source-structure-diagnostic.json

      - name: Upload source structure diagnostic report
        if: always() && inputs.diagnostic_structure == true
        uses: actions/upload-artifact@v4
        with:
          name: source-structure-diagnostic-${{ github.run_id }}
          path: state/source-structure-diagnostic.json
          if-no-files-found: error

      - name: Verify cloud credentials are configured
        if: inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && inputs.diagnostic_structure != true
        shell: bash
        run: |
          missing=0
          for name in GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET ONEDRIVE_DRIVE_ID ONEDRIVE_ITEM_ID; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub secret: $name"; missing=1; fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Failing closed: no acquisition or workbook publication was attempted."
            exit 1
          fi

      - name: Gate on local 06:00 time
        id: local_time
        if: inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && inputs.diagnostic_structure != true
        shell: bash
        run: |
          # Manual dispatch is an explicit test and must run immediately.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/Los_Angeles date +%H)" != "06" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC trigger outside local 06:00."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download canonical workbook template
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true
        shell: bash
        run: |
          python orchestrator/download_onedrive.py "state/input/Transit Agency Monitor.xlsx"
          # Keep compatibility with configs that resolve paths from the
          # orchestrator directory rather than the repository root.
          mkdir -p orchestrator/state/input
          cp "state/input/Transit Agency Monitor.xlsx" "orchestrator/state/input/Transit Agency Monitor.xlsx"
          echo "Verified workbook locations:"
          ls -l "state/input/Transit Agency Monitor.xlsx" \
                "orchestrator/state/input/Transit Agency Monitor.xlsx"

      - name: Run nine-agency orchestrator in staging mode
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true
        shell: bash
        run: |
          # This intentionally points at a cloud-specific configuration that
          # must be added with Linux paths and a portable workbook publisher
          # before the schedule is enabled for production publication.
          test -f orchestrator/config.github-actions.json || {
            echo "Missing orchestrator/config.github-actions.json; cloud publication is not enabled." >&2
            exit 1
          }
          python -m orchestrator run --config orchestrator/config.github-actions.json

      - name: Validate committed workbook package before upload
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && success()
        shell: bash
        run: |
          workbook=$(find state/github-actions-committed -type f -name 'Transit Agency Monitor.xlsx' | sort | tail -n 1)
          test -n "$workbook" || { echo "No committed workbook found" >&2; exit 1; }
          python orchestrator/validate_xlsx_package.py "$workbook"

      - name: Upload run logs and reports
        if: always() && steps.local_time.outputs.run == 'true' && inputs.diagnostic_excluded != true && inputs.diagnostic_only != true
        shell: bash
        run: |
          mkdir -p state
          {
            echo "Artifact inventory"
            echo "commit=$(git rev-parse HEAD)"
            find state orchestrator/state -type f -maxdepth 6 2>/dev/null | sort || true
          } > state/artifact-inventory.txt

      - name: Upload run logs and reports artifact
        if: always() && steps.local_time.outputs.run == 'true' && inputs.diagnostic_excluded != true && inputs.diagnostic_only != true
        uses: actions/upload-artifact@v4
        with:
          name: eight-agency-monitor-${{ github.run_id }}
          path: |
            state/**
            orchestrator/state/**/*.jsonl
            orchestrator/state/**/*manifest.json
            orchestrator/state/**/*exception*.json
          if-no-files-found: error

      - name: Publish verified workbook to OneDrive
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && success()
        shell: bash
        run: |
          workbook=$(find state/github-actions-committed -type f -name 'Transit Agency Monitor.xlsx' | sort | tail -n 1)
          test -n "$workbook" || { echo "No committed workbook found" >&2; exit 1; }
          python orchestrator/upload_onedrive.py "$workbook"

      - name: Build website from current monitor payload
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && success()
        shell: bash
        run: |
          payload=$(find state/github-actions-staging -type f -path '*/workbook_payload/*.normalized.json' | sort | tail -n 1)
          test -n "$payload" || { echo "No normalized payload found" >&2; exit 1; }
          python orchestrator/site_publish.py "$payload" "state/site"

      - name: Configure GitHub Pages
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && success()
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: state/site

      - name: Deploy website to GitHub Pages
        if: steps.local_time.outputs.run == 'true' && inputs.diagnostic_only != true && inputs.diagnostic_excluded != true && success()
        uses: actions/deploy-pages@v4
