name: Ten-agency split monitor

on:
  workflow_dispatch:
  schedule:
    # Two UTC triggers cover daylight-saving offsets; the local-time gate
    # permits exactly the 06:00 America/Los_Angeles run.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  acquire:
    name: Acquire sources on approved network
    # Register an Ubuntu/Linux self-hosted runner with this exact label.
    runs-on: [self-hosted, transit-monitor-linux]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install acquisition dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cloud-transit-monitor/requirements.txt
          python -m playwright install chromium
      - name: Gate scheduled run at local 06:00
        id: local_time
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [ "$(TZ=America/Los_Angeles date +%H)" = "06" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping duplicate UTC trigger outside local 06:00."
          fi
      - name: Acquire ten-agency source snapshot
        if: steps.local_time.outputs.run == 'true'
        shell: bash
        run: |
          mkdir -p state
          python orchestrator/live_aggregate_adapter.py \
            --agency BART --agency MARTA --agency MTA --agency CTA \
            --agency DART --agency "RTD Denver" --agency SEPTA \
            --agency UTA --agency "Sound Transit" --agency MBTA \
            --agency WMATA --agency "LA Metro" \
            --output state/acquisition.json
      - name: Upload source snapshot to GitHub-hosted job
        if: steps.local_time.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ten-agency-source-${{ github.run_id }}
          path: state/acquisition.json
          if-no-files-found: error

  publish:
    name: Validate and publish on GitHub-hosted runner
    needs: acquire
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GRAPH_TENANT_ID: ${{ secrets.GRAPH_TENANT_ID }}
      GRAPH_CLIENT_ID: ${{ secrets.GRAPH_CLIENT_ID }}
      GRAPH_CLIENT_SECRET: ${{ secrets.GRAPH_CLIENT_SECRET }}
      ONEDRIVE_ITEM_ID: ${{ secrets.ONEDRIVE_ITEM_ID }}
      ONEDRIVE_DRIVE_ID: ${{ secrets.ONEDRIVE_DRIVE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ten-agency-source-${{ github.run_id }}
          path: state
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install publisher dependencies
        run: python -m pip install openpyxl
      - name: Verify cloud credentials
        run: |
          for name in GRAPH_TENANT_ID GRAPH_CLIENT_ID GRAPH_CLIENT_SECRET ONEDRIVE_DRIVE_ID ONEDRIVE_ITEM_ID; do
            if [ -z "${!name}" ]; then echo "Missing required GitHub secret: $name"; exit 1; fi
          done
      - name: Download canonical workbook
        run: python orchestrator/download_onedrive.py "state/input/Transit Agency Monitor.xlsx"
      - name: Validate and publish workbook
        run: |
          mkdir -p state/output
          python orchestrator/workbook_publish_portable.py \
            "state/input/Transit Agency Monitor.xlsx" \
            "state/acquisition.json" \
            "state/output/Transit Agency Monitor.xlsx" \
            "state/output/manifest.json"
          python orchestrator/validate_xlsx_package.py "state/output/Transit Agency Monitor.xlsx"
          python orchestrator/upload_onedrive.py "state/output/Transit Agency Monitor.xlsx"
      - name: Build website from current monitor payload
        run: python orchestrator/site_publish.py "state/acquisition.json" "state/site"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: state/site
      - name: Deploy website to GitHub Pages
        uses: actions/deploy-pages@v4
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ten-agency-split-${{ github.run_id }}
          path: state
          if-no-files-found: error
